# Temporary: regenerates Gemfile.lock for the Rails 8.1 update. Removed in the next commit.
name: tmp-bundle-lock
on:
  push:
    branches: [ chore/rails-8.1 ]
    paths: [ .github/workflows/tmp-bundle-lock.yml ]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - run: gem install bundler -v 2.7.2
      - run: bundle lock --update rails
        env:
          BUNDLE_FROZEN: "false"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "chore(deps): bundle lock --update rails (Rails 8.1)"
          git push
